[package]
name = "minicodex"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "test-util"] }
